# Access Transformer for Custom Building.
#
# CreativeModeTabs caches the built creative tab contents in a private static field and only
# rebuilds them when the feature flags / permissions / registry access change.  After a datapack
# /reload those never change, so the cache has to be invalidated manually in order for newly
# configured blueprints to show up in the "Custom Building" tab.
public net.minecraft.world.item.CreativeModeTabs CACHED_PARAMETERS
